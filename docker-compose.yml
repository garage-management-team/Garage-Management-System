services:
  # ==========================================
  # CUSTOMER BACKEND
  # ==========================================
  customer-backend:
    build:
      context: ./backend/customer-backend
      dockerfile: Dockerfile

    container_name: gms-customer-backend
    restart: unless-stopped

    ports:
      - "8081:8081"
      - "9091:9091"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gms_customer_db
      SPRING_DATASOURCE_USERNAME: gms_admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
  # ==========================================
  # GARAGE BACKEND
  # ==========================================
  garage-backend:
    build:
      context: ./backend/garage-backend
      dockerfile: Dockerfile

    container_name: gms-garage-backend
    restart: unless-stopped

    ports:
      - "8082:8082"
      - "9090:9090"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gms_garage_db
      SPRING_DATASOURCE_USERNAME: gms_admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      APP_BOOTSTRAP_MANAGER_ENABLED: "true"
      APP_BOOTSTRAP_MANAGER_FULL_NAME: ${BOOTSTRAP_MANAGER_FULL_NAME}
      APP_BOOTSTRAP_MANAGER_EMAIL: ${BOOTSTRAP_MANAGER_EMAIL}
      APP_BOOTSTRAP_MANAGER_PHONE: ${BOOTSTRAP_MANAGER_PHONE}
      APP_BOOTSTRAP_MANAGER_PASSWORD: ${BOOTSTRAP_MANAGER_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:17
    container_name: gms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: gms_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gms_admin -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:



