# Application
spring.application.name=garage-service-backend
server.port=8082

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/gms_garage_db
spring.datasource.username=gms_admin
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# gRPC Client Configuration
grpc.client.garage.host=gms-custmer-backend
grpc.client.garage.port=9090