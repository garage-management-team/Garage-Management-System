syntax = "proto3";

package garage.availability;

option java_multiple_files = true;

option java_package = "com.gms.grpc.availability";

option java_outer_classname = "GarageAvailabilityProto";

// Garage availability service
service GarageAvailabilityService {

    // Get available time slots for a service and date
    rpc GetAvailableSlots (AvailabilityRequest)
        returns (AvailabilityResponse);
}

// Request message
message AvailabilityRequest {

    string service_type_id = 1;

    string date = 2;
}

// Response message
message AvailabilityResponse {

    repeated AvailableSlot slots = 1;
}

// Individual available slot
message AvailableSlot {

    string slot_id = 1;

    string service_type_id = 2;

    string service_name = 3;

    string date = 4;

    string start_time = 5;

    string end_time = 6;

    int32 available_capacity = 7;
}