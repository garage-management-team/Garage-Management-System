syntax = "proto3";

package customer.information;

option java_multiple_files = true;
option java_package = "com.gms.grpc.customer";
option java_outer_classname = "CustomerInformationProto";

service CustomerInformationService {

    rpc GetBookingCustomerDetails (BookingCustomerRequest)
        returns (BookingCustomerResponse);
}

message BookingCustomerRequest {
    string customer_id = 1;
    string vehicle_id = 2;
}

message BookingCustomerResponse {
    CustomerInformation customer = 1;
    VehicleInformation vehicle = 2;
}

message CustomerInformation {
    string name = 1;
    string email = 2;
    string phone = 3;
}

message VehicleInformation {
    string registration_number = 1;
    string model = 2;
    string vehicle_type = 3;
    int32 manufacture_year = 4;
}